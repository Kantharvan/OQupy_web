name: Nightly Smoke
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
  status:
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: false
jobs:
  smoke:
    name: Live production smoke
    if: github.event_name != 'status' || (github.event.state == 'success' && github.event.context == 'Vercel')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ignore preview and superseded deployment statuses
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            core.setOutput('run', context.eventName !== 'status' || context.payload.sha === data.commit.sha);
      - uses: actions/checkout@v4
        if: steps.release.outputs.run == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.release.outputs.run == 'true'
        with:
          node-version: 22
      - name: Read-only desktop and mobile browser smoke
        if: steps.release.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:smoke
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: |
            smoke-report/
            test-results/**/*.png
          retention-days: 7
